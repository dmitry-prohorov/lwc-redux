<template>
    <div class="slds-box slds-theme_default">
        <lightning-input
            type="search"
            label="Search contacts"
            placeholder="Type a name, e.g. ada"
            value={query}
            is-loading={isSearching}
            data-id="query"
            onchange={handleQueryChange}
        ></lightning-input>
        <template lwc:if={hasResults}>
            <ul class="slds-list_dotted slds-var-m-top_small">
                <template for:each={results} for:item="contact">
                    <li key={contact.id} data-result>{contact.name}</li>
                </template>
            </ul>
        </template>
    </div>
</template>
