<template>
    <div class="slds-box slds-theme_default">
        <p class="slds-text-heading_large" data-id="count">{count}</p>
        <p class="slds-text-color_weak slds-var-m-bottom_small" data-id="history">History: {history}</p>
        <lightning-button-group>
            <lightning-button label="-" data-id="decrement" onclick={handleDecrement}></lightning-button>
            <lightning-button label="+" data-id="increment" onclick={handleIncrement}></lightning-button>
        </lightning-button-group>
        <lightning-button-group class="slds-var-m-left_small">
            <lightning-button
                label="Undo"
                icon-name="utility:undo"
                disabled={undoDisabled}
                data-id="undo"
                onclick={handleUndo}
            ></lightning-button>
            <lightning-button
                label="Redo"
                icon-name="utility:redo"
                disabled={redoDisabled}
                data-id="redo"
                onclick={handleRedo}
            ></lightning-button>
            <lightning-button label="Clear history" data-id="clear" onclick={handleClear}></lightning-button>
        </lightning-button-group>
    </div>
</template>
