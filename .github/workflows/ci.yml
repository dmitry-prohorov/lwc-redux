name: CI

on:
    push:
        branches: [main]
    pull_request:
    workflow_dispatch:

jobs:
    test:
        name: Unit tests
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: npm

            - run: npm ci

            - name: Run tests with coverage
              run: npm run test:unit:coverage -- --coverageReporters=text --coverageReporters=text-summary --coverageReporters=json-summary

            - name: Coverage summary
              if: always()
              run: |
                  node -e "
                  const { total } = require('./coverage/coverage-summary.json');
                  const rows = ['lines', 'statements', 'functions', 'branches']
                      .map((key) => '| ' + key + ' | ' + total[key].pct + '% |');
                  console.log(['### Coverage', '', '| Metric | % |', '| --- | --- |', ...rows].join('\n'));
                  " >> "$GITHUB_STEP_SUMMARY"
